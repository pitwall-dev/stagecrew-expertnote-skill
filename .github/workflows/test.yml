name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate package layout and frontmatter
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path("skills/stagecrew-expert-note")
          content = (root / "SKILL.md").read_text(encoding="utf-8")
          assert content.startswith("---\n"), "frontmatter must start at byte zero"
          match = re.search(r"\n---\s*\n", content[4:])
          assert match, "frontmatter must have a closing delimiter"
          frontmatter = content[4:match.start() + 4]
          assert re.search(r"^name:\s*stagecrew-expert-note\s*$", frontmatter, re.MULTILINE)
          assert re.search(r"^description:\s*.+$", frontmatter, re.MULTILINE)
          assert len(content) <= 100_000
          assert (root / "scripts/create_expert_note.py").is_file()
          PY
      - name: Compile scripts
        run: python3 -m py_compile skills/stagecrew-expert-note/scripts/*.py tests/*.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
